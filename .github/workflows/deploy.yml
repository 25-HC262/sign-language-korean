name: Deploy to GCE (sign-language-korean)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      IMAGE: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sign-language-korean/model-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE }}:latest" \
            .
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Upload redeploy script to VM
        run: |
          gcloud compute ssh sign-language-model \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command="mkdir -p /opt/sign-language-korean/deploy"
          gcloud compute scp deploy/redeploy.sh \
            sign-language-model:/opt/sign-language-korean/deploy/redeploy.sh \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet

      - name: Deploy to GCE via IAP SSH
        run: |
          gcloud compute ssh sign-language-model \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command="bash /opt/sign-language-korean/deploy/redeploy.sh ${{ env.IMAGE }}:${{ github.sha }}"
