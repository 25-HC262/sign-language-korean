name: Deploy to GCE (sign-language-korean)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      IMAGE: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sign-language-korean/model-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE }}:latest" \
            .
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Prepare VM (Docker install if missing)
        run: |
          gcloud compute ssh sign-language-model \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command='
              if ! command -v docker &>/dev/null; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq ca-certificates curl
                sudo install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                  | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                sudo chmod a+r /etc/apt/keyrings/docker.gpg
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                  https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
                  | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
                sudo apt-get update -qq
                sudo apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin
                sudo systemctl enable docker
                sudo systemctl start docker
              fi
              sudo mkdir -p /opt/sign-language-korean/models/gloss_models
              sudo touch /opt/sign-language-korean/.last-deployed-image
            '

      - name: Upload redeploy script to VM
        run: |
          gcloud compute scp deploy/redeploy.sh \
            sign-language-model:~/redeploy.sh \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet
          gcloud compute ssh sign-language-model \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo mkdir -p /opt/sign-language-korean/deploy && sudo mv ~/redeploy.sh /opt/sign-language-korean/deploy/redeploy.sh"

      - name: Deploy Korean server to GCE via IAP SSH
        run: |
          gcloud compute ssh sign-language-model \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash /opt/sign-language-korean/deploy/redeploy.sh ${{ env.IMAGE }}:${{ github.sha }}"

      - name: Prepare VM for ISLR server
        run: |
          gcloud compute ssh sign-language-model \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command='
              sudo mkdir -p /opt/sign-language-islr/models/islr
              sudo touch /opt/sign-language-islr/.last-deployed-image
            '

      - name: Upload ISLR redeploy script to VM
        run: |
          gcloud compute scp deploy/redeploy_islr.sh \
            sign-language-model:~/redeploy_islr.sh \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet
          gcloud compute ssh sign-language-model \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo mkdir -p /opt/sign-language-islr/deploy && sudo mv ~/redeploy_islr.sh /opt/sign-language-islr/deploy/redeploy_islr.sh"

      - name: Deploy ISLR server to GCE via IAP SSH
        run: |
          gcloud compute ssh sign-language-model \
            --zone=asia-northeast3-a \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash /opt/sign-language-islr/deploy/redeploy_islr.sh ${{ env.IMAGE }}:${{ github.sha }}"
